# Runs on the EC2 host. Postgres is RDS, so there is no database service here.
# Images are pulled from ECR; nothing is built on the box (a t3.micro cannot
# build a Next.js app). Configuration comes from the .env file beside this one.
name: excalidraw

services:
  # Spring Boot: REST API and WebSocket server in one process. Flyway applies
  # pending migrations on startup, before the port opens, so no separate
  # migration job is needed.
  #
  # Must stay at exactly one replica: socket connections live in memory with no
  # shared pub/sub, so a second instance would split rooms in half.
  backend:
    image: ${ECR_REGISTRY:?}/excalidraw-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Heap capped to share 1 GB with the frontend and Caddy; the initial heap
      # is sized from RAM, so it grows only as needed.
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
      DATABASE_URL: ${DATABASE_URL:?}
      JWT_SECRET: ${JWT_SECRET:?}
      PORT: 3001
      # Same-origin in this topology, but the API still echoes it on CORS and
      # checks it on the WebSocket handshake.
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The JVM plus migrations take longer to come up than Node did.
      start_period: 60s

  frontend:
    image: ${ECR_REGISTRY:?}/excalidraw-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --max-old-space-size=256
    expose:
      - "3000"

  # Terminates TLS with a Let's Encrypt certificate it provisions itself, then
  # routes by path and strips the /api prefix the REST API does not expect.
  # Port 80 stays published for the ACME HTTP-01 challenge and for the redirect
  # to HTTPS that Caddy installs automatically.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
