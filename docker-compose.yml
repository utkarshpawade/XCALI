services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: excalidraw
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Spring Boot: REST API and WebSocket server on one port. Flyway applies
  # pending migrations on startup, so there is no separate migration job.
  backend:
    build:
      context: apps/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/excalidraw
      # Change this before exposing the stack to anyone else.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell or a root .env file}
      PORT: 3001
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3002}
    ports:
      - "3001:3001"

volumes:
  postgres-data:
