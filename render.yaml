# Render Blueprint - the backend and its Postgres database.
# The frontend goes to Vercel; see "Deployment" in the README.
#
#   Render Dashboard -> New -> Blueprint -> pick this repo -> Apply.
#
# One value is asked for at apply time (marked `sync: false` because it is not
# knowable until the other half of the stack exists):
#
#   ALLOWED_ORIGINS  the Vercel URL, e.g. https://your-app.vercel.app

# Every resource sits in the same region so the service reaches the database
# over the private network. Singapore is Render's closest region to India.
databases:
  - name: excalidraw-db
    databaseName: excalidraw
    user: excalidraw
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    # The service reaches the database over Render's private network, so no
    # public ingress is needed. Add your own IP here if you want psql access
    # from your laptop.
    ipAllowList: []

services:
  # Spring Boot: REST API (auth, rooms, shape history) and the WebSocket server
  # that broadcasts and persists shapes, on one port. Flyway applies pending
  # migrations on startup, before the port opens.
  #
  # Keep this at one instance: socket connections live in memory, so a second
  # instance would split rooms in half.
  - type: web
    name: excalidraw-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/backend/Dockerfile
    # The backend is self-contained; it does not need the pnpm workspace.
    dockerContext: ./apps/backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: excalidraw-db
          property: connectionString
      # Generated once. At least 32 bytes, which Render's generated values are.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Comma separated. Set this to your Vercel URL - a wrong value here is
      # the usual cause of CORS failures in the browser, and it also gates the
      # WebSocket handshake.
      - key: ALLOWED_ORIGINS
        sync: false
